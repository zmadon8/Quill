name: Investments speed bench

# Times the Investments pages and the heavy calculations on the planning dataset (about 5,000 transactions, 150 investments, ten years of
# daily prices) against a real PostgreSQL, without the 25 minutes of tests. Run it on a speed branch (perf/**) or by hand.
# Read the BENCH lines (seconds=) and, for the operations named in --profile, the PROFILE tables (where the time goes).
on:
  push:
    branches: ["perf/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: quill
          POSTGRES_PASSWORD: quill-test-password
          POSTGRES_DB: quill_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quill -d quill_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only-throwaway-key-not-a-secret
      DATABASE_URL: postgres://quill:quill-test-password@localhost:5432/quill_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python manage.py migrate
      - name: Timing only (no memory tracing)
        run: |
          python manage.py investments_memory_bench --timing-only \
            --only dataset_build --only dashboard --only page_overview_cold --only page_overview_warm \
            --only page_holdings_cold --only page_holdings_warm --only page_investment --only page_transactions \
            --only chart_portfolio_5y --only performance_3y --only alerts_and_insights --only annual_report
      - name: Pages and calculations (memory traced, with profiles)
        run: |
          python manage.py investments_memory_bench \
            --only dataset_build --only dashboard --only page_overview_cold --only page_overview_warm \
            --only page_holdings_cold --only page_holdings_warm --only page_investment --only page_transactions \
            --only chart_portfolio_5y --only performance_3y --only alerts_and_insights --only annual_report \
            --profile dashboard --profile page_overview_cold --profile page_holdings_cold --profile page_investment
