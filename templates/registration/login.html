{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block program_name %}{% endblock %}
{% block content %}
<h1>Log in</h1>
<form method="post" class="stack">
  {% csrf_token %}
  {{ form.as_p }}
  <input type="hidden" name="next" value="{{ next }}">
  <button type="submit">Log in</button>
</form>
{% endblock %}
