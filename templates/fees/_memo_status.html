{# A memo's status as a marker plus words, so colour is never the only signal. Context: m (a memo dict or DTO). #}
{% if m.written_off %}<span class="status status-written-off"><span class="status-sq" aria-hidden="true"></span>Written off</span>{% elif m.is_draft %}<span class="status status-draft"><span class="status-sq" aria-hidden="true"></span>Draft</span>{% elif m.is_overdue %}<span class="status status-overdue"><span class="status-sq" aria-hidden="true"></span>{{ m.status }} (overdue)</span>{% else %}<span class="status status-{{ m.status|lower }}"><span class="status-sq" aria-hidden="true"></span>{{ m.status }}</span>{% endif %}
