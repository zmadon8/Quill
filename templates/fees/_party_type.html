{# A Plaintiff type / Defendant type drop-down with a Custom box. Needs name, label, types (the profile's list) and value (the stored type). party-type.js shows the box only for Custom; without it both show. #}
<select name="{{ name }}_choice" data-party-choice aria-label="{{ label }}"><option value=""{% if not value %} selected{% endif %}>(none)</option>{% for t in types %}<option value="{{ t }}"{% if t == value %} selected{% endif %}>{{ t }}</option>{% endfor %}<option value="__custom__"{% if value and value not in types %} selected{% endif %}>Custom…</option></select>
<input type="text" name="{{ name }}_custom" value="{% if value and value not in types %}{{ value }}{% endif %}" maxlength="100" placeholder="Custom type" aria-label="Custom {{ label|lower }}" data-party-custom>
