{# Filter bar. Context: filters, firm_choices; optional show_fy, show_unpaid. #}
<form method="get" class="filters">
  {% if show_fy %}<label>Financial year <input type="text" name="fy" value="{{ filters.financial_year|default:'' }}" size="8" placeholder="2026-27"></label>{% endif %}
  <label>Firm <select name="firm"><option value="">All</option>{% for f in firm_choices %}<option value="{{ f.pk }}"{% if filters.firm_id == f.pk %} selected{% endif %}>{{ f.name }}</option>{% endfor %}</select></label>
  {% if show_unpaid %}<label><input type="checkbox" name="unpaid" value="1"{% if filters.unpaid_only %} checked{% endif %}> Unpaid only</label>{% endif %}
  <button type="submit">Filter</button>
</form>
