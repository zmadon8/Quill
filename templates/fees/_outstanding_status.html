{# An outstanding memo's state as a marker plus words. Context: e (an entry from list_outstanding). #}
{% if e.is_written_off %}<span class="status status-written-off"><span class="status-sq" aria-hidden="true"></span>Written off</span>{% elif e.is_overdue %}<span class="status status-overdue"><span class="status-sq" aria-hidden="true"></span>{% if e.amount_paid %}Partly paid{% else %}Unpaid{% endif %} (overdue)</span>{% elif e.amount_paid %}<span class="status status-partial"><span class="status-sq" aria-hidden="true"></span>Partly paid</span>{% else %}<span class="status status-unpaid"><span class="status-sq" aria-hidden="true"></span>Unpaid</span>{% endif %}
