{# One header-bar link, as a word. Context: url, name, icon (template path), on (current page), header_words. The icon keeps its name for screen readers (aria-label) and as a tooltip (title). #}<a href="{{ url }}" class="{% if on %}on{% endif %}"{% if on %} aria-current="page"{% endif %} aria-label="{{ name }}" title="{{ name }}">{% if header_words %}{{ name }}{% else %}{% include icon %}{% endif %}</a>
