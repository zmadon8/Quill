{% extends "base_suite_home.html" %}
{% block title %}{{ title }} - {{ diary_name }}{% endblock %}
{% block content %}
<h1>{{ title }}</h1>
{% if note %}<p>{{ note }}</p>{% endif %}
<form method="post" class="stack">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Save</button>
  <a href="{% url 'profile_list' %}">Cancel</a>
</form>
{% endblock %}
