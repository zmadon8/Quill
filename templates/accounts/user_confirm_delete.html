{% extends "base.html" %}
{% block title %}Delete user - Judgment Diary{% endblock %}
{% block content %}
<h1>Delete user</h1>
{% if problem %}
<p class="error">{{ problem }}</p>
<p><a href="{% url 'user_list' %}">Back to users</a></p>
{% else %}
<p>Delete user <strong>{{ target.username }}</strong>? This cannot be undone.</p>
<form method="post">
  {% csrf_token %}
  <button type="submit" class="danger">Delete</button>
  <a href="{% url 'user_list' %}">Cancel</a>
</form>
{% endif %}
{% endblock %}
