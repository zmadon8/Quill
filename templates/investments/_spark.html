{# A 90-day trend line in a table cell (owner round 2026-11). Context: s (from svgchart.sparkline) or nothing. #}{% load investments_money %}{% if s %}<svg class="spark {% if s.up %}up{% else %}down{% endif %}" viewBox="0 0 {{ s.width }} {{ s.height }}" width="{{ s.width }}" height="{{ s.height }}" role="img" aria-label="Last 90 days: {% if s.up %}up{% else %}down{% endif %} {{ s.change|pct }}"><polyline points="{{ s.points }}"/></svg>{% else %}<span class="na">&ndash;</span>{% endif %}
