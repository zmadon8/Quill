{% extends "investments/base_investments.html" %}
{% block inv_content %}
<div class="page-head"><h1>Add investment</h1></div>
<div class="stepper"><div class="on"><b>1</b>Type</div><div><b>2</b>Details</div><div><b>3</b>Confirm</div><div><b>4</b>What next</div></div>
<div class="choices">
{% for key, title, text in kinds %}
  <div class="ch"><div><h3>{{ title }}</h3><p>{{ text }}</p></div><a class="btn p" href="{% url 'investments_add_2' %}?kind={{ key }}">Choose</a></div>
{% endfor %}
</div>
{% endblock %}
