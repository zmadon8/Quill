{% extends "investments/base_investments.html" %}
{% block inv_content %}
<div class="titlebar"><h1 class="t">Folio number</h1></div>
<div class="ban wa"><span>{{ err.message }}</span></div>
<form method="post" action="{% url 'investments_investment_folio' inst.pk %}">{% csrf_token %}
  {% for f in form %}<input type="hidden" name="{{ f.html_name }}" value="{{ f.value|default_if_none:'' }}">{% endfor %}
  <input type="hidden" name="confirm_new" value="on">
  <div class="acts-row"><button class="btn p" type="submit">Yes, it is a different folio: add it</button><a class="btn q" href="{% url 'investments_investment' inst.pk %}">No, it is the same</a></div>
</form>
{% endblock %}
