{# Round 18 (D95): for someone with several profiles, a small menu next to the header name to use another one. It opens that profile's Subjects page. No script needed (details/summary). #}<details class="profile-switch" data-profile-switch><summary title="Switch profile" aria-label="Switch profile"><svg viewBox="0 0 12 12" width="12" height="12" aria-hidden="true" focusable="false"><path d="M2 4l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></summary><form method="post" action="{% url 'profile_switch' %}" class="profile-menu">{% csrf_token %}<span class="profile-menu-title">Switch to</span>{% for p in other_profiles %}<button type="submit" name="profile" value="{{ p.pk }}">{% if p.display_name %}{{ p.display_name }} <small>({{ p.name }})</small>{% else %}{{ p.name }}{% endif %}</button>{% endfor %}</form></details>
