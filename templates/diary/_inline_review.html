<div class="fld">
  <span class="field-label">For review</span>
  <div class="switch-line">
    <label class="edit-switch"><input type="checkbox" name="needs_review" value="1"{% if values.needs_review %} checked{% endif %}><span>For review</span></label>
    <input type="text" name="review_note" value="{{ values.review_note }}" placeholder="Note for review (optional)" aria-label="Review note">
  </div>
</div>
