{% extends "base_suite_home.html" %}
{% block title %}{{ home_name }}{% endblock %}
{% block content %}
<div class="launcher">
  <h1>Programs</h1>
  {% if diary_profile %}
  <a class="program-link" href="{% url 'diary_home' %}">{{ program_label }}</a>
  {% else %}
  <p class="muted">No programs are available to you yet.</p>
  {% endif %}
  <p class="help-link"><a href="{% url 'help' %}">Help: how to use this site</a></p>
</div>
{% endblock %}
