{% extends "base.html" %}
{% load static %}
{% block title %}Add an entry{% endblock %}
{% block content %}
<div class="home-column">
  <h1>Add an entry</h1>
  <p>It will be added {{ where }}.</p>
  <form method="post" action="{% url 'edit_add' %}" class="edit-form" data-add-form>
    {% csrf_token %}
    <input type="hidden" name="ref" value="{{ ref }}">
    <input type="hidden" name="after_version" value="{{ ref_version }}">
    <input type="hidden" name="next" value="{{ next_url }}">
    <label>Add a
      <select name="choice" data-add-what>
        {% for o in options %}<option value="{{ o.value }}"{% if o.value == default %} selected{% endif %}>{{ o.label }}</option>{% endfor %}
      </select>
    </label>
    {% include "diary/_add_fields.html" with ekind="page" eid="add" %}
    {% include "diary/_add_marking.html" %}
    <div class="edit-confirm">
      <button type="submit" class="button primary">Add</button>
      <button type="submit" class="button" name="then" value="link" data-add-save-link hidden>Add And Link&hellip;</button>
      <a class="button" href="{{ next_url }}">Cancel</a>
    </div>
  </form>
</div>
<script src="{% static 'js/richtext-editor.js' %}"></script>
<script src="{% static 'js/add-form.js' %}"></script>
{% endblock %}
